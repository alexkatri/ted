spring.application.name=ted
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/ted
spring.datasource.username=user
spring.datasource.password=ted2024!

# SSL
server.port=8443
server.ssl.key-store=classpath:local-ssl.p12
server.ssl.key-store-password=ted2024

# JKS or PKCS12
server.ssl.keyStoreType=PKCS12

spring.jackson.serialization.fail-on-empty-beans=false

# max file size for upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# number of scheduled tasks running simultaneously
spring.task.scheduling.pool.size=2
